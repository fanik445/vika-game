<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пни Вику</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #1a1a2e;
            color: white;
            transition: background-color 0.3s;
            margin: 0;
        }
        h1 { font-size: 28px; }
        #score {
            font-size: 72px;
            font-weight: bold;
            color: #e94560;
            margin: 20px 0;
        }
        button {
            font-size: 24px;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            background-color: #e94560;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #message {
            margin-top: 30px;
            font-size: 20px;
            color: #ffd700;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h1>😈 Пни Вику!</h1>
    <div id="score">0</div>
    <button id="kickBtn">👟 Пнуть</button>
    <div id="message"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let score = 0;
        const phrases = [
            "Ай! 😡", "Ты чего дерешься?! 😭", "Прекрати! 😤",
            "Мне больно! 🤕", "Еще раз и получишь! 🥊",
            "Хулиган! 😠", "Я пожалуюсь маме! 😢"
        ];
        const colors = ["#1a1a2e", "#16213e", "#0f3460", "#533483", "#2b2d42"];

        const scoreEl = document.getElementById("score");
        const messageEl = document.getElementById("message");
        const btn = document.getElementById("kickBtn");

        btn.addEventListener("click", () => {
            score++;
            scoreEl.textContent = score;
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            messageEl.textContent = phrase;
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
